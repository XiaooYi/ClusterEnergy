services:
  b-gateway:
    build:
      context: ./gateway
    container_name: cluster-energy-gateway
    network_mode: host
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./certs:/certs:ro
      - ./data:/data
    command:
      - "--bind"
      - "127.0.0.1"
      - "--port"
      - "18081"
      - "--upstream"
      - "https://127.0.0.1:19200"
      - "--interval"
      - "2.0"
      - "--db"
      - "/data/energy_history.db"
      - "--ca"
      - "/certs/ca.crt"
      - "--cert"
      - "/certs/b_client.crt"
      - "--key"
      - "/certs/b_client.key"

  b-web:
    build:
      context: ./frontend
    container_name: cluster-energy-web
    network_mode: host
    restart: unless-stopped
    depends_on:
      - b-gateway
