services:
  b-gateway:
    image: clusterenergy/gateway:${CE_ARCH:-arm64}
    pull_policy: never
    network_mode: host
    restart: unless-stopped
    volumes:
      - "${CE_CERTS_DIR:-./certs}:/certs:ro"
      - b-data:/data
    environment:
      CE_MYSQL_PASSWORD: "${CE_MYSQL_PASSWORD:-clusterenergy123}"
    command:
      - --bind
      - "127.0.0.1"
      - --port
      - "${CE_GATEWAY_PORT:-18081}"
      - --upstream
      - "${CE_A_UPSTREAM:?Set the A HTTPS endpoint}"
      - --mode
      - "${CE_MODE:-real}"
      - --storage
      - "${CE_STORAGE:-sqlite}"
      - --mysql-host
      - "${CE_MYSQL_HOST:-127.0.0.1}"
      - --mysql-port
      - "${CE_MYSQL_PORT:-3306}"
      - --mysql-user
      - "${CE_MYSQL_USER:-clusterenergy}"
      - --mysql-db
      - "${CE_MYSQL_DB:-clusterenergy_${CE_MODE:-real}}"
      - --sim-clock-offset-seconds
      - "${CE_SIM_CLOCK_OFFSET_SECONDS:-0}"
      - --db
      - "/data/b-${CE_MODE:-real}.sqlite"
      - --ca
      - /certs/ca.crt
      - --cert
      - /certs/b_client.crt
      - --key
      - /certs/b_client.key
  b-mysql:
    image: clusterenergy/mysql:${CE_ARCH:-arm64}
    profiles: ["mysql"]
    pull_policy: never
    network_mode: host
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${CE_MYSQL_ROOT_PASSWORD:-${CE_MYSQL_PASSWORD:-clusterenergy123}}"
      MYSQL_DATABASE: "${CE_MYSQL_DB:-clusterenergy_${CE_MODE:-real}}"
      MYSQL_USER: "${CE_MYSQL_USER:-clusterenergy}"
      MYSQL_PASSWORD: "${CE_MYSQL_PASSWORD:-clusterenergy123}"
    volumes:
      - b-mysql-data:/var/lib/mysql
    command:
      - --bind-address=127.0.0.1
      - --port=${CE_MYSQL_PORT:-3306}
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
  b-web:
    image: clusterenergy/web:${CE_ARCH:-arm64}
    pull_policy: never
    network_mode: host
    restart: unless-stopped
    environment:
      CE_GATEWAY_ADDR: "127.0.0.1:${CE_GATEWAY_PORT:-18081}"
      CE_WEB_PORT: "${CE_WEB_PORT:-18088}"
    depends_on:
      - b-gateway
volumes:
  b-data:
  b-mysql-data:
